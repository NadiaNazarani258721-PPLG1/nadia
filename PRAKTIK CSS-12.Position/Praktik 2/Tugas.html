<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative; 
            width: 300px; 
            height: 300px; 
            background-color: lightgray;
        }
        .corner { 
            position: absolute; 
            width: 100px; 
            height: 100px; 
            background: coral; 
        }
        .top-left { 
            top: 0; 
            left: 0; 
        }
        .top-right { 
            top: 0; 
            right: 0; 
        }
        .bottom-left { 
            bottom: 0; 
            left: 0; 
        }
        .bottom-right { 
            bottom: 0; 
            right: 0; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="corner top-left">TopLeft</div>
        <div class="corner top-right">TopRight</div>
        <div class="corner bottom-left">BottomLeft</div>
        <div class="corner bottom-right">BottomRight</div>
    </div>
</body>
</html>
